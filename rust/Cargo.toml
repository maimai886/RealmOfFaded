# Realm of Faded 的 Rust 程式，六個 crate，規劃在 docs/Rust重構規劃.md
# 只有 gdext 依賴 godot，其他的跑測試不用編 godot 綁定
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
rof-data = { path = "crates/data" }
rof-core = { path = "crates/core" }
rof-protocol = { path = "crates/protocol" }
rof-netcore = { path = "crates/netcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
godot = { version = "0.5.5", features = ["api-4-7"] }

[profile.dev.package."*"]
# 依賴的套件用最佳化編，自己的程式照舊，除錯版跑起來不會太慢
opt-level = 2
