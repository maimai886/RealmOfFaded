# 六個 crate 的分工在 docs/Rust重構規劃.md，只有 gdext 依賴 godot
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
rof-data = { path = "crates/data" }
rof-core = { path = "crates/core" }
rof-protocol = { path = "crates/protocol" }
rof-netcore = { path = "crates/netcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
godot = { version = "0.5.5", features = ["api-4-7"] }
glam = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# 依賴的套件開最佳化，除錯版才不會慢
[profile.dev.package."*"]
opt-level = 2
